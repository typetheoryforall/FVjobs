name: Add a job
description: Submit an open formal verification role for the board
title: "[job] Company — Role"
labels: ["new job"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for adding to the board. Everything here comes straight from the
        posting — please do not add estimates or private contact details.
  - type: input
    id: company
    attributes:
      label: Company
      placeholder: Harmonic
    validations: { required: true }
  - type: input
    id: role
    attributes:
      label: Role title
      description: As the posting words it
      placeholder: Formal Verification Engineer
    validations: { required: true }
  - type: dropdown
    id: category
    attributes:
      label: Kind of verification
      options:
        - hardware
        - software
        - ai-for-proof (AI for proof and autoformalization)
        - academic (university or research-institute post)
        - cryptocurrency (blockchain, smart contracts, ZK)
    validations: { required: true }
  - type: input
    id: url
    attributes:
      label: Link to the posting
      description: The posting itself where one exists, otherwise the careers page
      placeholder: https://…
    validations: { required: true }
  - type: input
    id: location
    attributes:
      label: Location
      description: As stated. Use "Anywhere" if genuinely unrestricted
      placeholder: Palo Alto, CA
    validations: { required: true }
  - type: dropdown
    id: remote
    attributes:
      label: Remote
      options:
        - onsite
        - hybrid
        - remote (within a stated region)
        - remote-worldwide
    validations: { required: true }
  - type: checkboxes
    id: stack
    attributes:
      label: Proof stack
      description: Tick every verification tool the posting names, and add any that are missing below
      options:
        - label: ACL2
        - label: Agda
        - label: automated reasoning
        - label: B method
        - label: C
        - label: C++
        - label: Dafny
        - label: equivalence checking
        - label: F*
        - label: formal methods
        - label: Haskell
        - label: HOL
        - label: Isabelle
        - label: JasperGold
        - label: Lean
        - label: LLVM
        - label: Mathlib
        - label: model checking
        - label: OCaml
        - label: program verification
        - label: proof assistants
        - label: PSL
        - label: Python
        - label: Questa Formal
        - label: Rocq
        - label: Rust
        - label: SAT
        - label: SMT
        - label: static analysis
        - label: SVA
        - label: SystemVerilog
        - label: theorem proving
        - label: TLA+
        - label: VC Formal
        - label: Verus
  - type: input
    id: stack_other
    attributes:
      label: Other tools
      description: Comma-separated, for tools the posting names that are not in the list above
      placeholder: Kani, Frama-C
  - type: input
    id: domain
    attributes:
      label: Domain
      description: Comma-separated
      placeholder: hardware, cryptography
    validations: { required: true }
  - type: dropdown
    id: seniority
    attributes:
      label: Seniority
      options:
        - intern
        - phd
        - postdoc
        - engineer
        - research-engineer
        - research-scientist
        - senior
        - principal
        - lead
        - any
    validations: { required: true }
  - type: input
    id: posted
    attributes:
      label: Date posted
      description: When the employer published it, if the posting shows a date. Leave blank otherwise.
      placeholder: "2026-10-27"
  - type: input
    id: work_authorization
    attributes:
      label: Work authorization restrictions
      description: >-
        The most useful field on the board. Export-control clauses, visa
        sponsorship, region limits. Leave blank if the posting says nothing.
      placeholder: US Person required (citizen, green card, refugee or asylee)
  - type: input
    id: compensation
    attributes:
      label: Published compensation
      description: Only figures the employer published. No third-party estimates.
      placeholder: USD 138,000–173,000
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: One or two factual sentences of useful context
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I checked today that this posting is live
          required: true
        - label: This role's core work is formal verification or directly supports it
          required: true
        - label: I have not included anyone's private contact details
          required: true
