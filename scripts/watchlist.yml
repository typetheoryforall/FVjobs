# Employers to check on every search run. `scripts/check.py watchlist` reads this file;
# the playbook (docs/search-playbook.md) explains each source.
#
# Each entry has `employer` and `ats`. What else it needs depends on the ats:
#   ashby, lever, lever-eu, greenhouse, workable, personio:  slug
#   teamtailor:  host (the board's RSS is https://{host}/jobs.rss)
#   workday:     host, site, and optional queries
#   jibe:        host, job_url (with {slug}), and optional queries
#   eightfold:   host, domain, and optional queries
#   amazon:      optional queries
#   manual:      how, for the person or agent doing it by hand
#
# Add every new employer a run discovers, with its ATS slug. Keep employers
# with nothing open if they have posted in-scope roles in the past year.

